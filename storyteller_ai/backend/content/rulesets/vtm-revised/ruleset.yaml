id: vtm-revised
version: 1.0.0
name: Vampire Storyteller Revised Structure
license: Proprietary project structure
attribution: Self-authored ruleset structure; rule text remains local to selected source documents
dice:
  kind: pool_successes
  default_expression: "{pool}d10>={difficulty}"
  params:
    ones_cancel: true
    botch_on_net_ones: true
    specialty_explode: 10
attributes:
  - {id: strength, label: Strength, group: physical, min: 1, max: 5}
  - {id: dexterity, label: Dexterity, group: physical, min: 1, max: 5}
  - {id: stamina, label: Stamina, group: physical, min: 1, max: 5}
  - {id: charisma, label: Charisma, group: social, min: 1, max: 5}
  - {id: manipulation, label: Manipulation, group: social, min: 1, max: 5}
  - {id: appearance, label: Appearance, group: social, min: 1, max: 5}
  - {id: perception, label: Perception, group: mental, min: 1, max: 5}
  - {id: intelligence, label: Intelligence, group: mental, min: 1, max: 5}
  - {id: wits, label: Wits, group: mental, min: 1, max: 5}
skills:
  - {id: alertness, label: Alertness, group: talents, min: 0, max: 5}
  - {id: athletics, label: Athletics, group: talents, min: 0, max: 5}
  - {id: intimidation, label: Intimidation, group: skills, min: 0, max: 5}
  - {id: investigation, label: Investigation, group: knowledges, min: 0, max: 5}
resources:
  - {id: health, label: Health, min: 0, max: 7, default: 0}
  - {id: willpower, label: Willpower, min: 0, max: 10, default: 5}
  - {id: blood_pool, label: Blood Pool, min: 0, max: 10, default: 1}
  - {id: humanity, label: Humanity, min: 0, max: 10, default: 7}
derived:
  health_levels: "7"
checks:
  - id: attribute_skill
    label: Attribute plus skill
    expression: "{pool}d10>={difficulty}"
    target_from: difficulty
turn_rules:
  combat_turn_mode: initiative
  initiative_check: "{dexterity}+{wits}+1d10"
  actions_per_turn: {default: 1}
chargen: []
npc_tiers:
  - {id: minion, sheet_profile: stat_block, required_paths: [/name, /health]}
  - {id: notable, sheet_profile: full, required_paths: [/name, /health]}
prompt_digest: >-
  Use a d10 pool against a declared difficulty for uncertain actions. Count successes, apply
  the pack's ones-cancel and botch settings, and keep supernatural details consistent with the
  campaign bible and selected local source documents.
family: storyteller-classic
origin: bundled